version: 2.1

# define this file as the setup phase of your dynamic configuration
setup: true

# invoke the path-filtering orb to make the filter job available
orbs:
  path-filtering: circleci/path-filtering@2.0.2
  circleci-cli: circleci/circleci-cli@0.1.9
  continuation: circleci/continuation@2.0.1

jobs:
  setup:
    executor: path-filtering/default
    steps:
      - checkout

      #Install the Circle cli
      - circleci-cli/install

      # generate the shared configuration from the directory with the pack command
      - run:
          name: Generate shared configuration
          command: circleci config pack .circleci/shared >> .circleci/shared-config.yml

      # The mapping will be used to generate the dynamic configuration for all the conditions that match
      - path-filtering/set-parameters:
          base-revision: pack-validate-continue-main
          config-path: .circleci/no-updates.yml
          mapping: |
            .* always-continue true .circleci/shared-config.yml
            src/.* build-code true .circleci/code-config.yml
            docs/.* build-docs true .circleci/docs-config.yml
            .* new-param true
            .* more-param true
            .* test-param false
            .* debug-param false

      # Generate the dynamic configuration based on the parameters
      - path-filtering/generate-config

      # Optionally validate the generated configuration
      - run:
          name: Validate config
          command: circleci config validate /tmp/generated-config.yml

      # Continue the pipeline with the generated configuration
      - continuation/continue:
          # since we are using continuation/continue customizably/manually instead of workflow path-filtering/filter
          # here we need to specify the configuration path which is generated by path-filtering/generate-config
          # and parameters file which is generated by path-fitltering/set-parameters
          # default -> configuration_path: ""
          configuration_path: /tmp/generated-config.yml # path-filtering/generate-config -> output-file
          # default -> parameters: "{}"
          parameters: /tmp/pipeline-parameters.json # path-filtering/set-parameters -> output-path
workflows:
  setup-workflow:
    jobs:
      - setup
